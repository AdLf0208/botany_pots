[package]
# Port of Botany Pots 21.1.44 (Darkhax-Minecraft/BotanyPots, LGPL-2.1-only),
# Minecraft Java 1.21.1 NeoForge; the port targets Horizon 26.3 at the pin in
# horizon-mod.toml. Clean-room Rust rewrite from the mod's behaviour (FINDINGS.md).
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "botanypots"
version = "0.2.1"
edition = "2024"
license = "LGPL-2.1-only"
description = "Botany Pots for Horizon: the botany pot and the hopper botany pot (slice 2)"
publish = false

[lib]
# The pure rules are `src/runtime.rs`; the crate root is `src/lib.rs`.
path = "src/lib.rs"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command (the launcher builds against its own copy of the same build). This port
# adds no registry dependency of its own.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
